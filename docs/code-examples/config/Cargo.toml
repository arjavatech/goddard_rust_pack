[package]
name = "hello-world-lambda"
version = "0.1.0"
edition = "2021"
description = "Rust Lambda function with Hello World API endpoints"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/rust-lambda-api"
keywords = ["lambda", "aws", "serverless", "api", "rust"]
categories = ["web-programming"]

[dependencies]
# Lambda runtime and web framework
lambda_web = "0.2"
lambda_runtime = "0.8"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

# Serialization and JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# HTTP types
http = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockall = "0.11"

# Test utilities
serde_test = "1.0"
tempfile = "3.0"

# Performance testing
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
# Build-time dependencies if needed
# None currently required

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[profile.release]
# Optimize for size and performance
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimization
panic = "abort"     # Smaller binary size
strip = true        # Remove debug symbols

[profile.dev]
# Development profile for faster builds
opt-level = 0
debug = true
overflow-checks = true

# Custom profile for Lambda deployment
[profile.lambda]
inherits = "release"
opt-level = 3       # Maximum optimization for performance
lto = "fat"        # Aggressive LTO
codegen-units = 1
panic = "abort"
strip = true

# Benchmark profile
[profile.bench]
inherits = "release"
debug = true        # Keep debug info for profiling

[features]
default = ["logging"]

# Feature flags
logging = ["tracing", "tracing-subscriber"]
metrics = []        # Add metrics collection (implement as needed)
testing = []        # Testing utilities

# Conditional dependencies
[target.'cfg(target_arch = "x86_64")'.dependencies]
# x86_64 specific dependencies

[target.'cfg(target_arch = "aarch64")'.dependencies]
# ARM64 specific dependencies

# Package metadata
[package.metadata.lambda]
# Cargo Lambda specific configuration
memory = 256
timeout = 30
environment = { RUST_LOG = "info" }

[package.metadata.docs.rs]
# Documentation generation
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Workspace configuration (if part of a larger workspace)
# [workspace]
# members = ["lambda", "shared"]
# resolver = "2"