openapi: 3.0.0
info:
  title: Goddard School Enrollment Management API
  version: 1.0.0
  description: |
    Complete API specification for the Goddard School enrollment management system.
    This API provides comprehensive enrollment tracking, form management, and parent portal functionality.

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: http://localhost:9000
    description: Local test server
  - url: https://hjny5xriqd.execute-api.us-west-2.amazonaws.com
    description: Production AWS Lambda endpoint
  - url: https://api.fillout.com
    description: Fillout API integration endpoint

paths:
  # ======================
  # Health & Test Endpoints
  # ======================
  /:
    get:
      summary: API Root
      operationId: base
      description: API root endpoint returning basic service information
      tags: [Health]
      responses:
        '200':
          description: Successfully retrieved API root information
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Goddard API v1.0.0"
                  status:
                    type: string
                    example: "operational"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      summary: Health Check
      operationId: health
      description: Check API health and operational status
      tags: [Health]
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                service: "goddard-api"
                version: "1.0.0"
                uptime: "72h"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /hello/{name}:
    get:
      summary: Hello with Name
      operationId: helloWithName
      description: Test endpoint that returns a personalized greeting
      tags: [Health]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "World"
      responses:
        '200':
          description: Successfully returned greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ======================
  # Admin Dashboard
  # ======================
  /admin/dashboard-metrics:
    get:
      summary: Dashboard Metrics
      operationId: getDashboardMetrics
      description: Retrieve comprehensive metrics for admin dashboard including classrooms, parents, children, and forms
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: "ca72c4cf-a513-4bc9-9a2f-17b15257e0cc"
      responses:
        '200':
          description: Successfully retrieved dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardMetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ======================
  # Schools
  # ======================
  /schools:
    get:
      summary: Get All Schools
      operationId: getAllSchools
      description: Retrieve a list of all schools in the system (public endpoint)
      tags: [Schools]
      responses:
        '200':
          description: Successfully retrieved schools list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolListItem'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create School
      operationId: createSchool
      description: Create a new school (SuperAdmin only)
      tags: [Schools]
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/post_school'
      responses:
        '201':
          description: School successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update School
      operationId: updateSchool
      description: Update an existing school (SuperAdmin only)
      tags: [Schools]
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/update_school'
      responses:
        '200':
          description: School successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /schools/{school_id}:
    delete:
      summary: Delete School
      operationId: deleteSchool
      description: Delete a school by ID (SuperAdmin only)
      tags: [Schools]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: school_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: School successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSchoolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ======================
  # Classrooms
  # ======================
  /classrooms:
    get:
      summary: Get All Classrooms
      operationId: getAllClassrooms
      description: Retrieve all classrooms for a specific school
      tags: [Classrooms]
      security:
        - BearerAuth: []
      parameters:
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved classrooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassroomListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create Classroom
      operationId: createClassroom
      description: Create a new classroom
      tags: [Classrooms]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/create_new_class'
      responses:
        '201':
          description: Classroom successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update Classroom
      operationId: updateClassroom
      description: Update an existing classroom
      tags: [Classrooms]
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/update_class'
      responses:
        '200':
          description: Classroom successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete Classroom
      operationId: deleteClassroom
      description: Delete a classroom
      tags: [Classrooms]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: classroom_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Classroom successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classrooms/{classroom_id}:
    get:
      summary: Get Classroom Details
      operationId: getClassroomDetails
      description: Get detailed classroom information including enrollment and capacity
      tags: [Classrooms]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: classroom_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved classroom details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classrooms/{classroom_id}/forms:
    get:
      summary: Get Classroom Forms
      operationId: getClassroomForms
      description: List all forms assigned to a classroom
      tags: [Classrooms]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: classroom_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved classroom forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassroomFormResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Assign Form to Classroom
      operationId: assignFormToClassroom
      description: Assign a form template to a classroom
      tags: [Classrooms]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: classroom_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: '#/components/requestBodies/assign_form_to_classroom'
      responses:
        '201':
          description: Form successfully assigned to classroom
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignClassroomFormResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classrooms/{classroom_id}/forms/{form_id}:
    delete:
      summary: Remove Form from Classroom
      operationId: removeFormFromClassroom
      description: Remove a form assignment from a classroom
      tags: [Classrooms]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: classroom_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: form_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Form successfully removed from classroom
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ======================
  # Form Templates
  # ======================
  /form-templates:
    get:
      summary: Get Form Templates
      operationId: getFormTemplates
      description: Retrieve all form templates for a school
      tags: [Form Templates]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved form templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormTemplateListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create Form Template
      operationId: createFormTemplate
      description: Create a new form template
      tags: [Form Templates]
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/create_form'
      responses:
        '201':
          description: Form template successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormTemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update Form Template
      operationId: updateFormTemplate
      description: Update an existing form template
      tags: [Form Templates]
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/update_form'
      responses:
        '200':
          description: Form template successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormTemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete Form Template
      operationId: deleteFormTemplate
      description: Delete a form template
      tags: [Form Templates]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: form_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Form template successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFormTemplateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ======================
  # Form Submissions
  # ======================
  /form-submissions/webhook:
    post:
      summary: Create Form Submission (Webhook)
      operationId: createFormSubmissionWebhook
      description: Create a new form submission from Fillout webhook
      tags: [Form Submissions]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Fillout webhook payload
      responses:
        '201':
          description: Form submission successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /form-submissions/{submission_id}:
    get:
      summary: Get Form Submission by ID
      operationId: getFormSubmissionById
      description: Retrieve a specific form submission by its ID
      tags: [Form Submissions]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved form submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSubmissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /form-submissions/{submission_id}/status:
    put:
      summary: Update Form Submission Status
      operationId: updateFormSubmissionStatus
      description: Update the status of a form submission
      tags: [Form Submissions]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: submission_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: '#/components/requestBodies/update_form_submission_status'
      responses:
        '200':
          description: Form submission status successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /form-submissions/latest:
    get:
      summary: Get Latest Form Submission
      operationId: getLatestFormSubmission
      description: Get the most recent version of a form submission
      tags: [Form Submissions]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: enrollment_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: form_template_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved latest form submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /form-submissions/versions:
    get:
      summary: Get Form Submission Versions
      operationId: getFormSubmissionVersions
      description: Get all versions (history) of a form submission
      tags: [Form Submissions]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: enrollment_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: form_template_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved form submission versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormSubmissionVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ======================
  # Student Form Assignments
  # ======================
  /student-form-assignments:
    get:
      summary: Get Student Form Assignments by School
      operationId: getStudentFormAssignmentsBySchool
      description: Retrieve all student form assignments for a school
      tags: [Student Form Assignments]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved student form assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentFormAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create Student Form Assignment
      operationId: createStudentFormAssignment
      description: Create a new student form assignment
      tags: [Student Form Assignments]
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/create'
      responses:
        '201':
          description: Student form assignment successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentFormAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update Student Form Assignment
      operationId: updateStudentFormAssignment
      description: Update an existing student form assignment
      tags: [Student Form Assignments]
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/update'
      responses:
        '200':
          description: Student form assignment successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentFormAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete Student Form Assignment
      operationId: deleteStudentFormAssignment
      description: Delete a student form assignment
      tags: [Student Form Assignments]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: assignment_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: school_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Student form assignment successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStudentFormAssignmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /student-form-assignments/review:
    put:
      summary: Review Student Form Assignment
      operationId: reviewStudentFormAssignment
      description: Review and approve/reject a student form assignment
      tags: [Student Form Assignments]
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/review_assignment'
      responses:
        '200':
          description: Student form assignment successfully reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStudentFormAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ======================
  # Class Form Overrides
  # ======================
  /class-form-overrides:
    post:
      summary: Create Class Form Override
      operationId: createClassFormOverride
      description: Create a form override for a specific classroom
      tags: [Class Form Overrides]
      security:
        - ApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/create_class_forms'
      responses:
        '201':
          description: Class form override successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassFormOverrideResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
