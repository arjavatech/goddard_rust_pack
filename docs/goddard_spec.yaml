      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
        settings:
          type: object
          nullable: true
      required:
        - id
        - name
        - subdomain

    # Classroom Request Schemas
    create_new_class:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        class_name:
          type: string
      required:
        - school_id
        - class_name

    update_class:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        class_name:
          type: string
      required:
        - school_id
        - class_id
        - class_name

    # Form Template Request Schemas
    create_form:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        form_name:
          type: string
        fillout_form_id:
          type: string
          nullable: true
      required:
        - school_id
        - form_name

    update_form:
      type: object
      properties:
        id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        form_name:
          type: string
        form_type:
          type: string
          nullable: true
        fillout_form_id:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        is_required:
          type: boolean
          nullable: true
        display_order:
          type: integer
          nullable: true
      required:
        - id
        - school_id
        - form_name

    # Form Submission Request Schemas
    update_form_submission_status:
      type: object
      properties:
        status:
          type: string
          enum: [pending, processing, completed, failed, requires_review, approved, rejected]
      required:
        - status

    # Student Form Assignment Request Schemas
    create:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        enrollment_id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        form_template_id:
          type: string
          format: uuid
        assignment_source:
          type: string
        status:
          type: string
          enum: [incomplete, in_progress, completed, approved, rejected]
          nullable: true
      required:
        - school_id
        - enrollment_id
        - child_id
        - form_template_id
        - assignment_source

    update:
      type: object
      properties:
        id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        enrollment_id:
          type: string
          format: uuid
          nullable: true
        child_id:
          type: string
          format: uuid
          nullable: true
        form_template_id:
          type: string
          format: uuid
          nullable: true
        assignment_source:
          type: string
          nullable: true
        status:
          type: string
          enum: [incomplete, in_progress, completed, approved, rejected]
          nullable: true
        is_required:
          type: boolean
          nullable: true
      required:
        - id
        - school_id

    review_assignment:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [approved, rejected]
        notes:
          type: string
          nullable: true
      required:
        - assignment_id
        - status

    # Class Form Override Request Schemas
    create_class_forms:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        form_template_id:
          type: string
          format: uuid
      required:
        - school_id
        - classroom_id
        - form_template_id

    # Enrollment Request Schemas
    parent_invite:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        child_first_name:
          type: string
        child_last_name:
          type: string
        child_birth_date:
          type: string
          format: date
        gender:
          type: string
        class_id:
          type: string
          format: uuid
        parent_email:
          type: string
          format: email
        parent_first_name:
          type: string
        parent_last_name:
          type: string
      required:
        - school_id
        - child_first_name
        - child_last_name
        - child_birth_date
        - gender
        - class_id
        - parent_email
        - parent_first_name
        - parent_last_name

    resend_confirmation:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
      required:
        - parent_id

    add_child_to_parent:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        child_first_name:
          type: string
        child_last_name:
          type: string
        child_birth_date:
          type: string
          format: date
        gender:
          type: string
        class_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
      required:
        - school_id
        - child_first_name
        - child_last_name
        - child_birth_date
        - gender
        - class_id
        - parent_id

    add_additional_child:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        child_first_name:
          type: string
        child_last_name:
          type: string
        child_birth_date:
          type: string
          format: date
        gender:
          type: string
        class_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        parent_first_name:
          type: string
        parent_last_name:
          type: string
      required:
        - school_id
        - child_first_name
        - child_last_name
        - child_birth_date
        - gender
        - class_id
        - parent_id

    # Portal Request Schemas
    assign_form_to_classroom:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
        form_template_id:
          type: string
          format: uuid
      required:
        - school_id
        - classroom_id
        - form_template_id

    update_child_status:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # Auth Request Schemas
    custom_data_auth:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        school_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [parent, admin, superadmin]
      required:
        - email
        - password
        - school_id
        - first_name
        - last_name
        - role

    invite_create_basic:
      type: object
      properties:
        email:
          type: string
          format: email
        school_id:
          type: string
          format: uuid
      required:
        - email
        - school_id

    form_review:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [approved, rejected]
        notes:
          type: string
          nullable: true
        approved_by:
          type: string
          format: uuid
      required:
        - assignment_id
        - status

  # ======================
  # Request Bodies
  # ======================
  requestBodies:
    post_school:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_school'
      required: true

    update_school:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_school'
      required: true

    create_new_class:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_new_class'
      required: true

    update_class:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_class'
      required: true

    create_form:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_form'
      required: true

    update_form:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_form'
      required: true

    update_form_submission_status:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_form_submission_status'
      required: true

    create:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create'
      required: true

    update:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update'
      required: true

    review_assignment:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/review_assignment'
      required: true

    create_class_forms:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_class_forms'
      required: true

    enrollment_parent_invite:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/parent_invite'
      required: true

    resend_mail:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/resend_confirmation'
      required: true

    add_child_to_parent:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/add_child_to_parent'
      required: true

    assign_form_to_classroom:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/assign_form_to_classroom'
      required: true

    update_child_status:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_child_status'
      required: true

    custom_data_auth:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/custom_data_auth'
      required: true

    invite_create_basic:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/invite_create_basic'
      required: true

  # ======================
  # Common Responses
  # ======================
  responses:
    BadRequest:
      description: Bad Request - Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "ValidationError"
            message: "Invalid request parameters"
            details: ["school_id is required", "Invalid UUID format"]

    Unauthorized:
      description: Unauthorized - Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "AuthenticationError"
            message: "Missing or invalid authentication token"

    Forbidden:
      description: Forbidden - Insufficient permissions to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "AuthorizationError"
            message: "Insufficient permissions to perform this action"

    NotFound:
      description: Not Found - The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "NotFoundError"
            message: "The requested resource was not found"

    InternalServerError:
      description: Internal Server Error - An unexpected error occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "InternalServerError"
            message: "An unexpected error occurred"
