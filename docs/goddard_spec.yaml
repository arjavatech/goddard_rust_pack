# ======================
# Components
# ======================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from Supabase authentication

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for server-to-server authentication

  # ======================
  # Response Schemas
  # ======================
  schemas:
    # Common/Utility Schemas
    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          example: "Operation completed successfully"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type
          example: "ValidationError"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid request parameters"
        details:
          type: array
          items:
            type: string
          description: Detailed error information
      required:
        - error
        - message

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        service:
          type: string
          example: "goddard-api"
        version:
          type: string
          example: "1.0.0"
        uptime:
          type: string
          example: "72h"
      required:
        - status
        - service
        - version

    HelloResponse:
      type: object
      properties:
        message:
          type: string
          example: "Hello, World!"
        name:
          type: string
          nullable: true
        request_id:
          type: string
          format: uuid
      required:
        - message
        - request_id

    # Admin Schemas
    AdminDashboardMetricsResponse:
      type: object
      properties:
        school_id:
          type: string
          format: uuid
        total_classrooms:
          type: integer
          format: int64
        total_active_parents:
          type: integer
          format: int64
        total_active_children:
          type: integer
          format: int64
        total_forms:
          type: integer
          format: int64
        classwise_metrics:
          type: array
          items:
            $ref: '#/components/schemas/ClasswiseMetric'
      required:
        - school_id
        - total_classrooms
        - total_active_parents
        - total_active_children
        - total_forms
        - classwise_metrics

    ClasswiseMetric:
      type: object
      properties:
        classroom_id:
          type: string
          format: uuid
        classroom_name:
          type: string
        total_enrollments:
          type: integer
          format: int64
        completed_enrollments:
          type: integer
          format: int64

    # School Schemas
    SchoolResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
        settings:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - subdomain

    SchoolListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subdomain:
          type: string
      required:
        - id
        - name
        - subdomain

    DeleteSchoolResponse:
      type: object
      properties:
        message:
          type: string
        school_id:
          type: string
          format: uuid
      required:
        - message
        - school_id

    # Classroom Schemas
    ClassroomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        name:
          type: string
        age_group:
          type: string
          nullable: true
        capacity:
          type: integer
          nullable: true
        enrolled_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - school_id
        - name

    ClassroomListResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_name:
          type: string
      required:
        - id
        - class_name

    ClassroomDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
