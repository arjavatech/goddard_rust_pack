[package]
name = "hello-world"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_runtime = "0.13"
lambda_web = "0.3"
axum = "0.7"
axum-test = "0.16"
tokio = { version = "1", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true